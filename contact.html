<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Advanced American Academy</title>
    <meta name="description" content="Send a message or question to Advanced American Academy. Fill in your name, email, and message, and add a phone number if desired.">
    <link rel="canonical" href="https://talyous1.github.io/git414-capstone-website/contact.html">

    <!-- Fonts Roboto and Noto Serif are both sourced from Google and have a SIL Open Font License -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header>
        <div class="wrapper">
            <!-- School logo, school brand identifier | Unsplash, Mar Sono | Free to use under the Unsplash License | SVG | 1584.6 x 1358.7 | 82px by 70px | Functional | SVG (vector, no raster export needed — scales at any density, no srcset required) | Accessibility: referenced as <img> so alt text carries the accessible name; SVG file includes a <title>. No audio, video, animation, or third-party embeds are used on this site.  -->
            <a href="index.html"><img src="planning/Content/aaa-logo.svg" alt="Advanced American Academy - Home" width="82" height="70"></a>
                <nav aria-label="Main">
                    <ul class="nav-list">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="admissions.html">Admissions</a></li>
                        <li><a href="tuition.html">Tuition</a></li>
                        <li><a href="contact.html" aria-current="page">Contact Us</a></li>
                    </ul>
                </nav>
        </div>
    </header>
    <main class="wrapper" id="main" tabindex="-1">
        <h1>Contact Us</h1>
        <p>Fields marked (required) must be filled in.</p>
        <form action="https://formsubmit.co/talyous1@asu.edu" method="post">
            <label for="name">Full name (required)</label>
            <input type="text" id="name" name="name" autocomplete="name" required>

            <label for="email">Email (required)</label>
            <input type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-hint">
            <p class="hint" id="email-hint">Example: name@email.com</p>

            <label for="phone">Phone number (optional)</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" aria-describedby="phone-hint">
            <p class="hint" id="phone-hint">Format: 713-555-0123</p>

            <label for="message">Message (required)</label>
            <textarea id="message" name="message" rows="6" required></textarea>

            <button type="submit" class="button">Send message</button>
        </form>
    </main>
    <footer>
        <div class="wrapper">
            <p>Advanced American Academy</p>
            <a href="contact.html">Contact Us</a><br><br>
            <p>This is a fictional school created for ASU GIT 414 coursework.</p>
        </div>
    </footer>
</body>
</html>
